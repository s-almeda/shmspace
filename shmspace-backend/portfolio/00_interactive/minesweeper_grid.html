<div style="padding:24px 0;display:flex;justify-content:center;">
<div style="background:#bdbdbd !important;padding:14px;border-top:3px solid #fff;border-left:3px solid #fff;border-right:3px solid #7b7b7b;border-bottom:3px solid #7b7b7b;display:inline-block;border-radius:0 !important;box-shadow:none !important;">

  <div id="ms-score" style="background:#000 !important;border-top:3px solid #7b7b7b;border-left:3px solid #7b7b7b;border-right:3px solid #fff;border-bottom:3px solid #fff;border-radius:0 !important;display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:60px;margin-bottom:10px;font-family:'Courier New','Courier',monospace;font-weight:bold;color:#ff0000;font-size:48px;line-height:1;letter-spacing:2px;">
    <span style="display:inline-block;">013</span>
    <span style="display:inline-block;">000</span>
  </div>

  <div style="background:#bdbdbd !important;padding:10px;border-top:3px solid #7b7b7b;border-left:3px solid #7b7b7b;border-right:3px solid #fff;border-bottom:3px solid #fff;border-radius:0 !important;box-shadow:none !important;">
    <div id="ms-grid" style="display:grid;grid-template-columns:repeat(7,56px);grid-template-rows:repeat(7,56px);gap:0;"></div>
  </div>
</div>
</div>
<style>
#ms-grid, #ms-grid * { border-radius: 0 !important; box-shadow: none !important; box-sizing: border-box !important; }
#ms-grid .cell {
  width: 56px !important;
  height: 56px !important;
  background: #bdbdbd !important;
  border-top: 4px solid #ffffff !important;
  border-left: 4px solid #ffffff !important;
  border-right: 4px solid #7b7b7b !important;
  border-bottom: 4px solid #7b7b7b !important;
  cursor: pointer;
  display: flex !important;
  align-items: center;
  justify-content: center;
  padding: 0 !important;
  margin: 0 !important;
  color: #000;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none !important;
  font-family: inherit;
  appearance: none !important;
  -webkit-appearance: none !important;
}
#ms-grid .cell.pressed,
#ms-grid .cell.revealed {
  border-top: 1px solid #7b7b7b !important;
  border-left: 1px solid #7b7b7b !important;
  border-right: 1px solid #bdbdbd !important;
  border-bottom: 1px solid #bdbdbd !important;
  padding: 3px !important;
  background: #bdbdbd !important;
}
#ms-grid .mine-svg { width: 44px; height: 44px; display: block; }
#ms-grid .smile-img { width: 50px; height: 50px; display: block; image-rendering: pixelated; }
</style>
<script>
(function(){
  const grid=document.getElementById('ms-grid');
  const SIZE=7;
  const CENTER=3;
  const cells=[];

  const mineSVG=`<svg class="mine-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g><rect x="11" y="2" width="2" height="20" fill="#000"/><rect x="2" y="11" width="20" height="2" fill="#000"/><line x1="5" y1="5" x2="19" y2="19" stroke="#000" stroke-width="2"/><line x1="19" y1="5" x2="5" y2="19" stroke="#000" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="#000"/><rect x="9" y="9" width="2" height="2" fill="#fff"/></g></svg>`;

  const smileIMG=`<img class="smile-img" src="assets/smiley.png" alt="smile">`;

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const div=document.createElement('div');
      div.className='cell';
      div.dataset.r=r;
      div.dataset.c=c;
      if(r===CENTER&&c===CENTER){
        div.classList.add('smile');
        div.innerHTML=smileIMG;
      }
      grid.appendChild(div);
      cells.push(div);
    }
  }

  function pressIn(el){
    if(el.classList.contains('revealed'))return;
    el.classList.add('pressed');
  }
  function pressOut(el){
    if(el.classList.contains('revealed'))return;
    el.classList.remove('pressed');
  }

  let revealed=false;
  function revealAll(){
    if(revealed)return;
    revealed=true;
    const ordered = cells.map((cell,i)=>{
      const r=Math.floor(i/SIZE), c=i%SIZE;
      const dist=Math.max(Math.abs(r-CENTER),Math.abs(c-CENTER));
      return { cell, dist, isSmile: cell.classList.contains('smile') };
    }).sort((a,b)=>a.dist-b.dist);

    ordered.forEach(({cell, dist, isSmile})=>{
      if(isSmile) return;
      setTimeout(()=>{
        cell.classList.remove('pressed');
        cell.classList.add('revealed');
        cell.innerHTML=mineSVG;
      }, dist*70);
    });
  }

  cells.forEach(el=>{
    if(el.classList.contains('smile')){
      el.addEventListener('mousedown',e=>{e.preventDefault();pressIn(el);});
      el.addEventListener('mouseup',()=>{pressOut(el);revealAll();});
      el.addEventListener('mouseleave',()=>pressOut(el));
      el.addEventListener('touchstart',e=>{e.preventDefault();pressIn(el);},{passive:false});
      el.addEventListener('touchend',e=>{e.preventDefault();pressOut(el);revealAll();},{passive:false});
      return;
    }
    el.addEventListener('mousedown',e=>{e.preventDefault();pressIn(el);});
    el.addEventListener('mouseup',()=>{pressOut(el);revealAll();});
    el.addEventListener('mouseleave',()=>pressOut(el));
    el.addEventListener('touchstart',e=>{e.preventDefault();pressIn(el);},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();pressOut(el);revealAll();},{passive:false});
  });
})();
</script>
